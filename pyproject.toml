[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dhrubotara"
version = "0.1.0"
description = "Reference-frame visual guidance: archived algorithms, recorded inputs, explicit limits"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "opencv-python-headless>=4.8"]

[project.scripts]
dhrubotara = "dhrubotara.replay:main"

[tool.setuptools.packages.find]
include = ["dhrubotara*"]
